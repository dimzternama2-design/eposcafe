<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPOS Kafe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { display: flex; height: 100vh; background: #f4f6f8; }
    .menu-container { flex: 2; padding: 20px; overflow-y: auto; }
    .cart-container { flex: 1; padding: 20px; background: #ffffff; border-left: 1px solid #ddd; display: flex; flex-direction: column; }
    h2 { margin-bottom: 15px; color: #333; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
    .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; }
    .card:hover { border-color: #007bff; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
    .card h4 { margin-bottom: 5px; font-size: 16px; }
    .card p { color: #28a745; font-weight: bold; }
    .cart-list { flex: 1; overflow-y: auto; margin-bottom: 15px; list-style: none; }
    .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
    .total { font-size: 18px; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; }
    button.btn-checkout { background: #28a745; color: white; border: none; padding: 12px; border-radius: 5px; width: 100%; font-size: 16px; cursor: pointer; }
    button.btn-checkout:hover { background: #218838; }
  </style>
</head>
<body>

  <div class="menu-container">
    <h2>Menu Kafe</h2>
    <div class="grid" id="menu-grid"></div>
  </div>

  <div class="cart-container">
    <h2>Pesanan</h2>
    <ul class="cart-list" id="cart-list"></ul>
    <div class="total">
      <span>Total:</span>
      <span id="cart-total">Rp 0</span>
    </div>
    <button class="btn-checkout" onclick="checkout()">Bayar Sekarang</button>
  </div>

  <script>
    let cart = [];

    async function loadMenu() {
      const res = await fetch('/api/menu');
      const result = await res.json();
      const grid = document.getElementById('menu-grid');
      
      grid.innerHTML = result.data.map(item => `
        <div class="card" onclick="addToCart('${item.name}', ${item.price})">
          <h4>${item.name}</h4>
          <p>Rp ${item.price.toLocaleString('id-ID')}</p>
        </div>
      `).join('');
    }

    function addToCart(name, price) {
      const existing = cart.find(item => item.name === name);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ name, price, qty: 1 });
      }
      renderCart();
    }

    function renderCart() {
      const list = document.getElementById('cart-list');
      const totalEl = document.getElementById('cart-total');
      let total = 0;

      list.innerHTML = cart.map(item => {
        const itemTotal = item.price * item.qty;
        total += itemTotal;
        return `
          <li class="cart-item">
            <span>${item.name} x${item.qty}</span>
            <span>Rp ${itemTotal.toLocaleString('id-ID')}</span>
          </li>
        `;
      }).join('');

      totalEl.innerText = `Rp ${total.toLocaleString('id-ID')}`;
    }

    async function checkout() {
      if (cart.length === 0) return alert('Keranjang masih kosong!');
      
      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      
      const res = await fetch('/api/checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: cart, total })
      });
      
      const result = await res.json();
      if (result.success) {
        alert('Transaksi Berhasil!');
        cart = [];
        renderCart();
      } else {
        alert('Gagal: ' + result.message);
      }
    }

    loadMenu();
  </script>
</body>
</html>
